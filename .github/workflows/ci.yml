# SAKLAZ AI — CI kapıları (FAZ1-PLAN §10.2). Bu kontrollerin hepsi geçmeden main'e birleştirme yapılmaz.
# Üçüncü taraf eylemler mutable etiketle değil, commit SHA ile sabitlenmiştir (tedarik zinciri güvenliği).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, sınır, tip, test) — ubuntu + PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-yalnizca-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Relay testleri her dosya için bu sunucuda ayrı bir veritabanı oluşturur.
      SAKLAZ_TEST_PG_URL: postgresql://postgres:ci-yalnizca-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test

  windows-agent:
    name: Windows — kripto, protokol ve ajan (SQLCipher yerel modülü)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: DPAPI yerel modülü derlemesi (A3)
        run: pnpm --filter @saklaz/win-keyprotect run build:native
      - run: pnpm --filter @saklaz/crypto --filter @saklaz/protocol --filter @saklaz/win-keyprotect --filter @saklaz/agent run test
      - name: DPAPI kullanıcı izolasyonu — ikinci yerel kullanıcı (A3)
        shell: pwsh
        run: ./tools/ci/dpapi-second-user.ps1

  windows-package:
    name: Windows ajan paketi (MVP alfa)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saklaz/win-keyprotect run build:native
      - run: pnpm --filter @saklaz/agent run build:dist
      - name: Paketleme
        shell: pwsh
        run: ./tools/package/windows-agent.ps1 -Out "$env:RUNNER_TEMP\pkg"
      - name: Duman testi — paketlenmiş ajan (gerçek DPAPI, şifreli kasa, SQLCipher; ağ yok)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\pkg-test"
          Expand-Archive "$env:RUNNER_TEMP\pkg\saklaz-agent-win-x64.zip" -DestinationPath $dir
          $exe = "$dir\saklaz-agent\saklaz-agent.cmd"
          & $exe version; if ($LASTEXITCODE -ne 0) { throw 'version' }
          & $exe selftest; if ($LASTEXITCODE -ne 0) { throw 'selftest' }
          & $exe status --profile business; if ($LASTEXITCODE -ne 0) { throw 'status' }
          $env:SAKLAZ_NO_START = '1'
          & "$dir\saklaz-agent\install-startup.ps1" -AgentProfile business
          if (-not (Get-ScheduledTask -TaskName 'SAKLAZ Agent (business)' -ErrorAction SilentlyContinue)) { throw 'başlangıç görevi kurulmadı' }
          & "$dir\saklaz-agent\uninstall-startup.ps1" -AgentProfile business
          if (Get-ScheduledTask -TaskName 'SAKLAZ Agent (business)' -ErrorAction SilentlyContinue) { throw 'başlangıç görevi kaldırılmadı' }
          Write-Host 'Windows paket duman testi: GEÇTİ'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saklaz-agent-win-x64
          path: |
            ${{ runner.temp }}/pkg/saklaz-agent-win-x64.zip
            ${{ runner.temp }}/pkg/saklaz-agent-win-x64.zip.sha256
          retention-days: 30

  android-apk:
    name: Android APK (MVP alfa)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mobil arayüz derlemesi
        run: |
          pnpm --filter @saklaz/mobile-web run build
          cp apps/mobile/web/dist/index.html apps/mobile/app/assets/web/index.html
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.27.4
          channel: stable
      - name: Android projesi ve analiz
        working-directory: apps/mobile/app
        run: |
          flutter create --org com.saklaz --project-name saklaz_ai --platforms android .
          rm -rf test
          python3 tool/prepare_android.py .
          flutter pub get
          flutter analyze --no-fatal-infos lib
      - name: APK derlemesi
        working-directory: apps/mobile/app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/saklaz-ai-0.1.0-alpha.apk"
          (cd "$RUNNER_TEMP" && sha256sum saklaz-ai-0.1.0-alpha.apk > saklaz-ai-0.1.0-alpha.apk.sha256 && cat saklaz-ai-0.1.0-alpha.apk.sha256)
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saklaz-ai-android-apk
          path: |
            ${{ runner.temp }}/saklaz-ai-0.1.0-alpha.apk
            ${{ runner.temp }}/saklaz-ai-0.1.0-alpha.apk.sha256
            ${{ runner.temp }}/pubspec.lock
          retention-days: 30

  dart-vectors:
    name: Dart uyumluluk vektörleri (S13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 3.5.4
      - working-directory: apps/mobile/vector_check
        run: |
          dart pub get
          dart test

  docker:
    name: Docker — relay imajı ve Compose (A2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Temel imajların özetleri (digest) — Dockerfile ve Compose'da sabitlenen değerlerle karşılaştırma
        run: |
          for img in $(grep -hoE '(node|postgres|caddy):[^ "}]+' infra/relay/Dockerfile infra/relay/docker-compose.yml | sort -u); do
            echo "$img → $(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}')"
          done
      - name: İmaj derlemesi
        run: docker build -t saklaz-relay:test -f infra/relay/Dockerfile .
      - name: Docker ve Compose entegrasyon testleri
        env:
          SAKLAZ_DOCKER_TEST: "1"
          SAKLAZ_RELAY_IMAGE: saklaz-relay:test
          SAKLAZ_DOCKER_LOG_DIR: ${{ runner.temp }}/docker-logs
        run: pnpm --filter @saklaz/relay exec vitest run -c vitest.docker.config.ts --reporter=verbose
      - name: Konteyner günlükleri (yalnızca hata durumunda; sentetik test verisi)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-logs
          path: ${{ runner.temp }}/docker-logs
          retention-days: 7

  windows-inventory:
    name: Windows envanter betiği (Pester, D6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pester 5.7.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Testler (değişiklik yapmama anlık görüntü testi dahil)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'tools/discovery/windows-envanter.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  secrets:
    name: Gizli bilgi taraması (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.28.0 (sağlama toplamı doğrulanmış)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner
