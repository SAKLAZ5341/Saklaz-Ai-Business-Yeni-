# SAKLAZ AI — CI kapıları (FAZ1-PLAN §10.2). Bu kontrollerin hepsi geçmeden main'e birleştirme yapılmaz.
# Üçüncü taraf eylemler mutable etiketle değil, commit SHA ile sabitlenmiştir (tedarik zinciri güvenliği).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, sınır, tip, test) — ubuntu + PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-yalnizca-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Relay testleri her dosya için bu sunucuda ayrı bir veritabanı oluşturur.
      SAKLAZ_TEST_PG_URL: postgresql://postgres:ci-yalnizca-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test

  windows-agent:
    name: Windows — kripto, protokol ve ajan (SQLCipher yerel modülü)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saklaz/crypto --filter @saklaz/protocol --filter @saklaz/agent run test

  dart-vectors:
    name: Dart uyumluluk vektörleri (S13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: 3.5.4
      - working-directory: apps/mobile/vector_check
        run: |
          dart pub get
          dart test

  docker:
    name: Docker — relay imajı ve Compose (A2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Temel imajların özetleri (digest) — Dockerfile ve Compose'da sabitlenen değerlerle karşılaştırma
        run: |
          for img in $(grep -hoE '(node|postgres|caddy):[^ "}]+' infra/relay/Dockerfile infra/relay/docker-compose.yml | sort -u); do
            echo "$img → $(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}')"
          done
      - name: İmaj derlemesi
        run: docker build -t saklaz-relay:test -f infra/relay/Dockerfile .
      - name: Docker ve Compose entegrasyon testleri
        env:
          SAKLAZ_DOCKER_TEST: "1"
          SAKLAZ_RELAY_IMAGE: saklaz-relay:test
          SAKLAZ_DOCKER_LOG_DIR: ${{ runner.temp }}/docker-logs
        run: pnpm --filter @saklaz/relay exec vitest run -c vitest.docker.config.ts --reporter=verbose
      - name: Konteyner günlükleri (yalnızca hata durumunda; sentetik test verisi)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-logs
          path: ${{ runner.temp }}/docker-logs
          retention-days: 7

  windows-inventory:
    name: Windows envanter betiği (Pester, D6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pester 5.7.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Testler (değişiklik yapmama anlık görüntü testi dahil)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'tools/discovery/windows-envanter.Tests.ps1'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  secrets:
    name: Gizli bilgi taraması (gitleaks)
    runs-on: ubuntu-24.04
    # PR: yalnızca hedef dal (güncel uç) ile PR kaynak SHA'sı arasındaki commit'ler.
    # main'e push: main'in tüm geçmişi. Tüm dallar/etiketler/PR referansları: gitleaks-full.yml (haftalık).
    # Kurallar ve fail-closed denetimleri: tools/ci/gitleaks-scan.sh.
    # GÜVEN SINIRI (çözülmemiş): pull_request olayında bu iş ve betik PR'ın kendi içeriğinden çalışır;
    # .github/** veya tools/ci/** dosyalarını değiştiren bir PR bu kontrolü devre dışı bırakabilir ve aynı
    # adla başarılı görünebilir. Kapatmak depo ayarı ister (CODEOWNERS + zorunlu onay); ayrıntı betik başında.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.28.0 (sağlama toplamı doğrulanmış)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSL -o "$RUNNER_TEMP/gitleaks/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks/gl.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Tarayıcı öz-sınaması (sentetik depolar; fail-closed, fork, birleştirme, atlatma denemeleri)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: bash tools/ci/gitleaks-scan.test.sh
      - name: Tarama
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
          SCAN_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: bash tools/ci/gitleaks-scan.sh
