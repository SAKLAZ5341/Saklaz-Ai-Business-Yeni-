# SAKLAZ AI relay — şirket içi VM (BUSINESS) veya kişisel VPS (PERSONAL) için.
# TASLAK: Sprint 2'de Docker ortamı olmadığından çalıştırılmadı. Sprint 5'te IT ile kurulumda doğrulanacak.
# Her çalışma alanı AYRI bir kurulumdur (ayrı sunucu, ayrı veritabanı, ayrı gizli bilgiler).
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["443:443"]            # dışarıya açılan TEK port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  relay:
    build: { context: ../.., dockerfile: infra/relay/Dockerfile }
    restart: unless-stopped
    environment:
      SAKLAZ_RELAY_ID: ${SAKLAZ_RELAY_ID:?çalışma alanına özgü relay kimliği gerekli}
      SAKLAZ_DATABASE_URL_FILE: /run/secrets/database_url
      SAKLAZ_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      SAKLAZ_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      SAKLAZ_MFA_KEY_FILE: /run/secrets/mfa_key
    secrets: [database_url, jwt_private, jwt_public, mfa_key]
    networks: [edge, internal]    # porta dışarıdan erişim yok; yalnızca caddy üzerinden
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [db]

  db:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: saklaz
      POSTGRES_USER: saklaz
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [internal]          # yalnızca iç ağ; dışarıya port yok
    security_opt: ["no-new-privileges:true"]

networks:
  edge: {}
  internal: { internal: true }    # internete çıkışı olmayan ağ

volumes:
  caddy_data: {}
  db_data: {}

secrets:
  database_url: { file: ./secrets/database_url }
  jwt_private: { file: ./secrets/jwt_private.pem }
  jwt_public: { file: ./secrets/jwt_public.pem }
  mfa_key: { file: ./secrets/mfa_key.hex }
  db_password: { file: ./secrets/db_password }
